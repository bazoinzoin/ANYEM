# Version officielle d'Anyem : à chaque étiquette vX.Y.Z poussée sur GitHub, fabrique le jeu
# Windows (Electron, sur une machine Windows) et publie une page de téléchargement (Release)
# avec Anyem-X.Y.Z.exe, le zip et anyem.html, et la section de CHANGELOG.md de la version.
# Lancé à la main (onglet Actions, « Run workflow ») : fabrique le .exe à tester (artefacts de
# l'exécution) ; avec « publier » coché, publie aussi la version de package.json (l'étiquette
# vX.Y.Z est alors créée par GitHub sur le commit lancé).
name: Version Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publier:
        description: 'Publier la version de package.json (étiquette vX.Y.Z et page de téléchargement)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Version et notes
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "package.json ($VERSION) ≠ étiquette ($GITHUB_REF_NAME)"; exit 1; }
          fi
          node tools/changelog.mjs "$VERSION" > release-notes.md
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Préparer la version Windows
        run: npm run desktop
      - name: Fabriquer le .exe
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run dist
      - name: Artefacts (.exe à tester)
        uses: actions/upload-artifact@v4
        with:
          name: anyem-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            dist/anyem.html
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Anyem ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            desktop/release/*.exe
            desktop/release/*.zip
            dist/anyem.html
            dist/anyem.ico

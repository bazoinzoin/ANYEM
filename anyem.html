<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anyem</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161009; --panel:#241b12; --panel2:#2e2216; --line:#4a3a26;
  --gold:#c9a876; --cream:#e8dcc8; --dim:#a9987e;
  --guerrier:#8a3a3a; --voleur:#3f6b45; --pretre:#3f5a8a; --mage:#7a3f7a;
  --danger:#a33; --good:#5a8a5a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  height:100%; margin:0; background:var(--bg); color:var(--cream);
  font-family:'EB Garamond',serif; font-size:17px; line-height:1.5;
  background-image:radial-gradient(ellipse at top,#2a1f14 0%,#161009 60%);
}
h1,h2,h3,.title{font-family:'Cinzel',serif; letter-spacing:.02em; color:var(--gold); margin:0;}
#app{max-width:900px; margin:0 auto; padding:24px 16px 40px;}
.hidden{display:none !important;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px;}
button{font-family:'EB Garamond',serif; font-size:16px; cursor:pointer; border-radius:5px; border:1px solid var(--line); background:var(--panel2); color:var(--cream); padding:10px 16px; transition:background .15s;}
button:hover{background:#3a2c1c;}
button:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
button:disabled{opacity:.4; cursor:not-allowed;}
input[type=text]{font-family:'EB Garamond',serif; font-size:16px; background:#100c07; border:1px solid var(--line); color:var(--cream); padding:8px 10px; border-radius:4px; width:100%;}

/* Header */
.hero{text-align:center; margin-bottom:28px;}
.hero h1{font-size:clamp(28px,6vw,42px);}
.hero p{color:var(--dim); margin-top:4px;}

/* Character creation */
.slots{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:20px;}
.slot{border-top:3px solid var(--c,var(--line));}
.slot .icon{font-size:34px;}
.slot .cname{font-family:'Cinzel',serif; font-size:15px; margin:6px 0 2px;}
.slot .role{color:var(--dim); font-size:13px; margin-bottom:8px;}
.slot .stats{font-size:13px; color:var(--dim); margin:8px 0;}

/* Village hub */
.portals{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin:16px 0;}
.portal{cursor:pointer; text-align:left;}
.portal h3{font-size:16px;}
.portal p{color:var(--dim); font-size:13px; margin:4px 0 0;}
.services{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;}
.party-strip{display:flex; gap:10px; overflow-x:auto; padding:4px 0 10px;}
.pmini{min-width:120px; text-align:center; padding:10px; border-top:3px solid var(--c,var(--line));}
.pmini .icon{font-size:24px;}
.barwrap{background:#100c07; border-radius:3px; height:8px; overflow:hidden; margin-top:4px;}
.bar{height:100%;}

/* Tooltips */
.tooltip{position:relative; cursor:help; border-bottom:1px dotted var(--dim);}
button.tooltip{border-bottom:none;}
.tooltip:hover::after, .tooltip:focus-visible::after{
  content:attr(data-tip); position:absolute; left:50%; transform:translateX(-50%); bottom:calc(100% + 9px);
  background:#0c0904; border:1px solid var(--line); color:var(--cream); padding:9px 11px; border-radius:5px;
  font-size:13px; line-height:1.4; width:210px; z-index:30; box-shadow:0 6px 14px rgba(0,0,0,.55); white-space:normal;
}
.tooltip:hover::before, .tooltip:focus-visible::before{
  content:''; position:absolute; left:50%; transform:translateX(-50%); bottom:100%;
  border:6px solid transparent; border-top-color:var(--line); z-index:30;
}

/* Combat */
#log{background:#100c07; border:1px solid var(--line); border-radius:4px; padding:10px; font-size:14px; height:110px; overflow-y:auto; margin:12px 0;}
#log div{margin-bottom:3px; color:var(--dim);}
#log div.hit{color:var(--cream);}
.combatants{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:12px;}
@media (max-width:600px){.combatants{grid-template-columns:1fr;}}
.unit{padding:10px; border-radius:5px; background:var(--panel2); border-left:3px solid var(--c,var(--line)); margin-bottom:8px; opacity:1; transition:opacity .3s;}
.unit.dead{opacity:.35;}
.unit .row1{display:flex; justify-content:space-between; align-items:baseline;}
.unit .row1 b{font-family:'Cinzel',serif; font-size:14px;}
.unit small{color:var(--dim);}
.actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.skillbox{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);}
.active-turn{outline:2px solid var(--gold);}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CLASSES = {
  guerrier:{name:'Guerrier',icon:'⚔️',c:'var(--guerrier)',res:'Rage',resMax:100,resStart:20,pv:130,atq:17,vit:8,mag:false,statName:'Force',
    skills:[{name:'Frappe Brutale',cost:30,mult:2.1,desc:'Coup lourd sur un ennemi'},{name:"Cri de Guerre",cost:55,mult:1.1,aoe:true,desc:'Frappe tous les ennemis'}]},
  voleur:{name:'Voleur',icon:'🗡️',c:'var(--voleur)',res:'Énergie',resMax:60,resStart:60,pv:95,atq:16,vit:15,mag:false,statName:'Agilité',
    skills:[{name:'Coup Vicieux',cost:20,mult:1.9,desc:'Frappe critique garantie'},{name:'Lacération',cost:15,mult:0.8,dot:3,desc:'Saignement sur 3 tours'}]},
  pretre:{name:'Prêtre',icon:'✨',c:'var(--pretre)',res:'Mana',resMax:80,resStart:80,pv:88,atq:9,vit:9,mag:true,statName:'Intelligence',
    skills:[{name:'Soin Majeur',cost:35,heal:2.6,desc:'Soigne fortement un allié'},{name:'Éclat de Lumière',cost:20,mult:1.5,desc:'Dégâts de lumière'}]},
  mage:{name:'Mage',icon:'🔥',c:'var(--mage)',res:'Mana',resMax:90,resStart:90,pv:78,atq:20,vit:10,mag:true,statName:'Intelligence',
    skills:[{name:'Boule de Feu',cost:30,mult:2.3,desc:'Dégâts de feu'},{name:'Éclair',cost:25,mult:1.8,desc:'Dégâts de foudre'}]}
};
const ORDER=['guerrier','voleur','pretre','mage'];
const CLASS_DESC={
  guerrier:"Combattant robuste au corps à corps. Accumule de la Rage en combattant et en encaissant des coups, qu'il dépense dans des frappes dévastatrices.",
  voleur:"Combattant agile et rapide. Son Énergie se régénère chaque tour, lui permettant d'enchaîner coups vicieux et poisons.",
  pretre:"Soigneur polyvalent. Dépense son Mana pour soigner ses alliés et infliger des dégâts de lumière.",
  mage:"Lanceur de sorts destructeur. Dépense son Mana pour infliger de lourds dégâts élémentaires à distance."
};

let state={screen:'create', party:[], gold:50, dungeonLvl:1, combat:null};

function rand(a,b){return a+Math.random()*(b-a);}
function el(html){const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild;}
function estimate(atq,mult){return {lo:Math.round(atq*mult*0.9), hi:Math.round(atq*mult*1.15)};}

function initParty(){
  state.party = ORDER.map(k=>{
    const c=CLASSES[k];
    return {key:k, name:c.name, hp:c.pv, hpMax:c.pv, res:c.resStart, resMax:c.resMax, alive:true, dot:0};
  });
}

// ---------- CREATE SCREEN ----------
function renderCreate(){
  const app=document.getElementById('app');
  app.innerHTML=`
  <div class="hero"><h1>Anyem</h1><p>Compose ton équipe de quatre héros avant de partir à l'aventure</p></div>
  <div class="slots">
    ${ORDER.map((k,i)=>{const c=CLASSES[k]; return `
    <div class="card slot" style="--c:${c.c}">
      <div class="icon tooltip" data-tip="${CLASS_DESC[k]}">${c.icon}</div>
      <div class="cname">${c.name}</div>
      <div class="role">Ressource : ${c.res}</div>
      <div class="stats">PV ${c.pv} · Attaque ${c.atq} · Vitesse ${c.vit}</div>
      <input type="text" id="name${i}" placeholder="Nom du héros" value="${c.name}">
    </div>`}).join('')}
  </div>
  <div style="text-align:center"><button id="startBtn" style="font-family:'Cinzel',serif; padding:12px 28px;">Commencer l'aventure</button></div>
  `;
  document.getElementById('startBtn').onclick=()=>{
    initParty();
    ORDER.forEach((k,i)=>{
      const v=document.getElementById('name'+i).value.trim();
      if(v) state.party[i].name=v;
    });
    state.screen='hub';
    render();
  };
}

// ---------- HUB SCREEN ----------
function renderHub(msg){
  const app=document.getElementById('app');
  app.innerHTML=`
  <div class="hero"><h1>Village d'Anyem</h1><p>Or : ${state.gold} · Donjon actuel : niveau ${state.dungeonLvl}</p></div>
  ${msg?`<div class="card" style="margin-bottom:16px; border-color:var(--gold)">${msg}</div>`:''}
  <div class="party-strip">
    ${state.party.map(p=>{const c=CLASSES[p.key]; return `
    <div class="card pmini" style="--c:${c.c}">
      <div class="icon">${c.icon}</div><div><b>${p.name}</b></div>
      <small>PV ${p.hp}/${p.hpMax}</small>
      <div class="barwrap"><div class="bar" style="width:${p.hp/p.hpMax*100}%; background:${c.c}"></div></div>
    </div>`}).join('')}
  </div>
  <div class="card">
    <h2>Portails</h2>
    <div class="portals">
      <div class="card portal" id="goDungeon"><h3>🌲 Forêt Maudite — Niveau ${state.dungeonLvl}</h3><p>Un groupe de gobelins garde le passage.</p></div>
    </div>
  </div>
  <div class="card" style="margin-top:14px;">
    <h2>Services</h2>
    <div class="services">
      <button id="inn" class="tooltip" data-tip="Soigne entièrement les PV et les ressources de toute l'équipe, gratuitement.">🛏️ Auberge — Se reposer (gratuit)</button>
      <button id="merchant" class="tooltip" data-tip="Achète et vend équipement, potions et consommables. Bientôt disponible.">🛒 Marchand</button>
      <button id="forge" class="tooltip" data-tip="Décrafte et améliore ton équipement grâce aux matéria. Bientôt disponible.">🔨 Forge</button>
      <button id="statsBtn" class="tooltip" data-tip="Consulte les statistiques détaillées de ton équipe.">📜 Statistiques</button>
    </div>
  </div>
  `;
  document.getElementById('goDungeon').onclick=startCombat;
  document.getElementById('inn').onclick=()=>{
    state.party.forEach(p=>{if(p.alive){p.hp=p.hpMax; p.res=CLASSES[p.key].resMax;}});
    renderHub('Vous vous reposez à l\'auberge. Équipe entièrement soignée.');
  };
  document.getElementById('merchant').onclick=()=>renderHub('Le marchand prépare son étal — bientôt disponible.');
  document.getElementById('forge').onclick=()=>renderHub('La forge est encore froide — bientôt disponible.');
  document.getElementById('statsBtn').onclick=()=>{state.screen='stats'; render();};
}

// ---------- STATS SCREEN ----------
function renderStats(){
  const app=document.getElementById('app');
  app.innerHTML=`
  <div class="hero"><h1>Feuilles de personnage</h1><p>Statistiques actuelles de votre équipe</p></div>
  <div class="slots">
    ${state.party.map(p=>{const c=CLASSES[p.key]; return `
    <div class="card slot" style="--c:${c.c}">
      <div class="icon">${c.icon}</div>
      <div class="cname">${p.name}</div>
      <div class="role">${c.name} · Stat principale : ${c.statName}</div>
      <div class="stats" style="text-align:left; line-height:1.8;">
        PV : ${p.hp}/${p.hpMax}<br>
        ${c.res} : ${p.res}/${p.resMax}<br>
        Attaque : ${c.atq}<br>
        Vitesse : ${c.vit}
      </div>
      <div class="skillbox" style="justify-content:flex-start;">
        ${c.skills.map(s=>{
          const est=estimate(c.atq, s.heal||s.mult||1);
          return `<div style="width:100%; font-size:13px; color:var(--dim); margin-bottom:6px; text-align:left;">
            <b style="color:var(--cream)">${s.name}</b> — ${s.cost} ${c.res}<br>
            ${s.heal?`Soin ~${est.lo}-${est.hi} PV`:`Dégâts ~${est.lo}-${est.hi}`}${s.aoe?' · zone':''}${s.dot?' · saignement 3 tours':''}
          </div>`;
        }).join('')}
      </div>
    </div>`}).join('')}
  </div>
  <div style="text-align:center"><button id="backHub">← Retour au village</button></div>
  `;
  document.getElementById('backHub').onclick=()=>{state.screen='hub'; render();};
}

// ---------- COMBAT ----------
function makeEnemy(n,lvl){
  const arr=[];
  for(let i=0;i<n;i++) arr.push({name:'Gobelin '+(i+1), hp:40+lvl*8, hpMax:40+lvl*8, atq:8+lvl*2, vit:rand(6,11), alive:true, guard:false});
  return arr;
}

function startCombat(){
  state.combat={enemies:makeEnemy(2,state.dungeonLvl), log:[], turnQueue:[], acting:null, over:false};
  state.party.forEach(p=>p.guard=false);
  logMsg(`Vous entrez dans la Forêt Maudite (niveau ${state.dungeonLvl}).`);
  state.screen='combat';
  nextRound();
  render();
}

function logMsg(t,hit){state.combat.log.unshift({t,hit}); if(state.combat.log.length>40) state.combat.log.pop();}

function nextRound(){
  const cb=state.combat;
  const combatants=[...state.party.filter(p=>p.alive).map(p=>({type:'p',ref:p})),
                    ...cb.enemies.filter(e=>e.alive).map(e=>({type:'e',ref:e}))];
  combatants.sort((a,b)=>(b.ref.vit||CLASSES[b.ref.key]?.vit||b.ref.vit)-(a.ref.vit||0));
  cb.turnQueue=combatants;
  cb.qIndex=0;
  advanceTurn();
}

function advanceTurn(){
  const cb=state.combat;
  if(checkEnd()) return;
  if(cb.qIndex>=cb.turnQueue.length){
    applyDots();
    if(checkEnd()) return;
    nextRound();
    return;
  }
  const t=cb.turnQueue[cb.qIndex];
  if((t.type==='p'&&!t.ref.alive)||(t.type==='e'&&!t.ref.alive)){
    cb.qIndex++; advanceTurn(); return;
  }
  cb.acting=t;
  if(t.type==='p'){
    const c=CLASSES[t.ref.key];
    t.ref.res=Math.min(t.ref.resMax, t.ref.res + (c.res==='Rage'?5:c.res==='Énergie'?20:10));
    render();
  } else {
    logMsg(`${t.ref.name} se prépare à agir...`);
    render();
    setTimeout(()=>{
      doEnemyTurn(t.ref);
      cb.qIndex++;
      render();
      if(checkEnd()) return;
      setTimeout(advanceTurn, 500);
    }, 800);
  }
}

function applyDots(){
  state.party.forEach(p=>{
    if(p.alive && p.dot>0){ p.hp=Math.max(0,p.hp-6); logMsg(`${p.name} souffre d'un saignement (-6 PV).`,true); if(p.hp<=0){p.alive=false; logMsg(`${p.name} s'effondre !`,true);} p.dot--; }
  });
}

function doEnemyTurn(en){
  const targets=state.party.filter(p=>p.alive);
  if(!targets.length) return;
  const tgt=targets[Math.floor(Math.random()*targets.length)];
  let dmg=Math.round(en.atq*rand(0.85,1.15));
  if(tgt.guard) dmg=Math.round(dmg*0.5);
  tgt.hp=Math.max(0,tgt.hp-dmg);
  logMsg(`${en.name} attaque ${tgt.name} pour ${dmg} dégâts.`,true);
  if(tgt.hp<=0 && tgt.alive){tgt.alive=false; logMsg(`${tgt.name} s'effondre !`,true);}
  else if(CLASSES[tgt.key]?.res==='Rage'){ tgt.res=Math.min(tgt.resMax, tgt.res+15); }
}

function checkEnd(){
  const cb=state.combat;
  if(cb.over) return true;
  if(state.party.every(p=>!p.alive)){ cb.over=true; endCombat(false); return true; }
  if(cb.enemies.every(e=>!e.alive)){ cb.over=true; endCombat(true); return true; }
  return false;
}

function endCombat(win){
  if(win){
    const gold=20+state.dungeonLvl*10;
    state.gold+=gold;
    state.dungeonLvl++;
    state.party.forEach(p=>{if(p.alive) p.hp=Math.min(p.hpMax,p.hp+Math.round(p.hpMax*0.15));});
    state.screen='hub';
    render();
    renderHub(`Victoire ! Vous rapportez ${gold} pièces d'or. Le prochain passage est plus dangereux.`);
  } else {
    const loss=Math.round(state.gold*0.2);
    state.gold-=loss;
    state.party.forEach(p=>{p.alive=true; p.hp=Math.round(p.hpMax*0.5); p.res=CLASSES[p.key].resMax;});
    state.screen='hub';
    render();
    renderHub(`Votre équipe est vaincue et regagne le village de justesse, ayant perdu ${loss} pièces d'or.`);
  }
}

function playerAct(action, skillIdx, targetIdx){
  const cb=state.combat; const t=cb.acting; const p=t.ref; const c=CLASSES[p.key];
  const aliveEnemies=cb.enemies.filter(e=>e.alive);
  if(action==='defend'){ p.guard=true; logMsg(`${p.name} se met en garde.`,true); }
  else if(action==='attack'){
    const target=aliveEnemies[targetIdx]||aliveEnemies[0];
    const dmg=Math.round(p.atqVal!==undefined?p.atqVal:CLASSES[p.key].atq*rand(0.9,1.15));
    target.hp=Math.max(0,target.hp-dmg);
    logMsg(`${p.name} attaque ${target.name} pour ${dmg} dégâts.`,true);
    if(target.hp<=0){target.alive=false; logMsg(`${target.name} est vaincu !`,true);}
    if(c.res==='Rage') p.res=Math.min(p.resMax,p.res+8);
  } else if(action==='skill'){
    const sk=c.skills[skillIdx];
    if(p.res<sk.cost) return;
    p.res-=sk.cost;
    if(sk.heal){
      const alliesAlive=state.party.filter(x=>x.alive);
      const target=alliesAlive[targetIdx]||alliesAlive[0];
      const amt=Math.round(c.atq*sk.heal);
      target.hp=Math.min(target.hpMax,target.hp+amt);
      logMsg(`${p.name} utilise ${sk.name} sur ${target.name} (+${amt} PV).`,true);
    } else if(sk.aoe){
      aliveEnemies.forEach(e=>{const dmg=Math.round(c.atq*sk.mult*rand(0.9,1.1)); e.hp=Math.max(0,e.hp-dmg); if(e.hp<=0)e.alive=false;});
      logMsg(`${p.name} utilise ${sk.name}, frappant tous les ennemis !`,true);
    } else {
      const target=aliveEnemies[targetIdx]||aliveEnemies[0];
      const dmg=Math.round(c.atq*sk.mult*rand(0.9,1.15));
      target.hp=Math.max(0,target.hp-dmg);
      if(sk.dot) target.dotTurns=sk.dot;
      logMsg(`${p.name} utilise ${sk.name} sur ${target.name} pour ${dmg} dégâts.`,true);
      if(target.hp<=0){target.alive=false; logMsg(`${target.name} est vaincu !`,true);}
    }
  }
  cb.qIndex++;
  advanceTurn();
}

function renderCombat(){
  const app=document.getElementById('app');
  const cb=state.combat;
  const actingP = cb.acting && cb.acting.type==='p' ? cb.acting.ref : null;
  app.innerHTML=`
  <div class="hero"><h1>⚔️ Combat</h1><p>Forêt Maudite — Niveau ${state.dungeonLvl}</p></div>
  <div class="combatants">
    <div><h3 style="font-size:14px; color:var(--dim); margin-bottom:6px;">VOTRE ÉQUIPE</h3>
      ${state.party.map(p=>{const c=CLASSES[p.key]; const active=actingP===p; return `
      <div class="unit ${p.alive?'':'dead'} ${active?'active-turn':''}" style="--c:${c.c}">
        <div class="row1"><b>${c.icon} ${p.name}</b><small>${p.hp}/${p.hpMax} PV</small></div>
        <div class="barwrap"><div class="bar" style="width:${p.hp/p.hpMax*100}%; background:${c.c}"></div></div>
        <small class="tooltip" data-tip="${c.res} : ressource dépensée pour lancer les compétences de ${c.name}.">${c.res}: ${p.res}/${p.resMax}</small>
        <div class="barwrap"><div class="bar" style="width:${p.res/p.resMax*100}%; background:var(--gold)"></div></div>
      </div>`}).join('')}
    </div>
    <div><h3 style="font-size:14px; color:var(--dim); margin-bottom:6px;">ENNEMIS</h3>
      ${cb.enemies.map((e,i)=>`
      <div class="unit ${e.alive?'':'dead'} ${cb.acting&&cb.acting.type==='e'&&cb.acting.ref===e?'active-turn':''}" style="--c:var(--danger)">
        <div class="row1"><b>👹 ${e.name}</b><small>${e.hp}/${e.hpMax} PV</small></div>
        <div class="barwrap"><div class="bar" style="width:${e.hp/e.hpMax*100}%; background:var(--danger)"></div></div>
      </div>`).join('')}
    </div>
  </div>
  <div id="log">${cb.log.map(l=>`<div class="${l.hit?'hit':''}">${l.t}</div>`).join('')}</div>
  ${actingP?renderActionPanel(actingP):`<div class="card" style="text-align:center; color:var(--dim);">${cb.acting&&cb.acting.type==='e'?cb.acting.ref.name+' agit...':"Préparation du tour..."}</div>`}
  `;
}

function renderActionPanel(p){
  const c=CLASSES[p.key];
  const atkEst=estimate(c.atq,1);
  return `
  <div class="card">
    <p>Au tour de <b style="color:${c.c}">${p.name}</b> (${c.name})</p>
    <div class="actions">
      <button id="actAttack" class="tooltip" data-tip="Attaque simple avec l'arme équipée. Dégâts estimés : ${atkEst.lo}-${atkEst.hi}.">Attaquer · ~${atkEst.lo}-${atkEst.hi}</button>
      <button id="actDefend" class="tooltip" data-tip="Réduit de moitié les dégâts subis ce tour.">Défendre</button>
      <span style="color:var(--dim); align-self:center;">Compétences ↓</span>
    </div>
    <div class="skillbox">
      ${c.skills.map((s,i)=>{
        const est=estimate(c.atq, s.heal||s.mult||1);
        const label=s.heal?`Soin ~${est.lo}-${est.hi} PV`:`~${est.lo}-${est.hi} dégâts${s.aoe?' (zone)':''}${s.dot?' + saignement':''}`;
        return `<button data-sk="${i}" class="actSkill tooltip" data-tip="${s.desc} — ${label}." ${p.res<s.cost?'disabled':''}>${s.name} (${s.cost} ${c.res}) · ${s.heal?`~${est.lo}-${est.hi} PV`:`~${est.lo}-${est.hi}`}</button>`;
      }).join('')}
    </div>
    <div id="targetZone" style="margin-top:10px;"></div>
  </div>`;
}

function wireCombatEvents(){
  const cb=state.combat; if(!cb || !cb.acting || cb.acting.type!=='p') return;
  const tz=document.getElementById('targetZone');
  const ab=document.getElementById('actAttack');
  const db=document.getElementById('actDefend');
  if(ab) ab.onclick=()=>{
    tz.innerHTML = cb.enemies.map((e,i)=>e.alive?`<button data-i="${i}" class="pickE">Cibler ${e.name}</button>`:'').join('');
    tz.querySelectorAll('.pickE').forEach(b=>b.onclick=()=>playerAct('attack',null,+b.dataset.i));
  };
  if(db) db.onclick=()=>playerAct('defend');
  document.querySelectorAll('.actSkill').forEach(b=>b.onclick=()=>{
    const idx=+b.dataset.sk;
    const sk=CLASSES[cb.acting.ref.key].skills[idx];
    if(sk.heal){
      const allies=state.party.filter(a=>a.alive);
      tz.innerHTML = allies.map((a)=>`<button data-i="${state.party.indexOf(a)}" class="pickA">Cibler ${a.name}</button>`).join('');
      tz.querySelectorAll('.pickA').forEach(bb=>bb.onclick=()=>playerAct('skill',idx,+bb.dataset.i));
    } else if(sk.aoe){
      playerAct('skill',idx,0);
    } else {
      tz.innerHTML = cb.enemies.map((e,i)=>e.alive?`<button data-i="${i}" class="pickE2">Cibler ${e.name}</button>`:'').join('');
      tz.querySelectorAll('.pickE2').forEach(bb=>bb.onclick=()=>playerAct('skill',idx,+bb.dataset.i));
    }
  });
}

function render(){
  if(state.screen==='create') renderCreate();
  else if(state.screen==='hub') renderHub();
  else if(state.screen==='stats') renderStats();
  else if(state.screen==='combat'){ renderCombat(); wireCombatEvents(); }
}
render();
</script>
</body>
</html>

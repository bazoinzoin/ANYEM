<!DOCTYPE html>
<html lang="fr">
<!-- Fichier généré par tools/build.mjs (npm run build) : ne pas modifier à la main. -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anyem</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
/* css/base.css */
/* Variables, reset et éléments de base. */

:root {
  --bg: #161009; --panel: #241b12; --panel2: #2e2216; --line: #4a3a26;
  --gold: #c9a876; --cream: #e8dcc8; --dim: #a9987e;
  --guerrier: #8a3a3a; --voleur: #3f6b45; --pretre: #3f5a8a; --mage: #7a3f7a; --chasseur: #7a6a2f; --paladin: #b08a3a;
  --danger: #a33; --good: #5a8a5a;
  --r-commun: #a8a29a; --r-peu-commun: #6cc15a; --r-rare: #5b9cf0; --r-epique: #b57cf2; --r-legendaire: #f0953a; --r-divin: #e8413c;
  --font-title: 'Cinzel', serif;
  --font-body: 'EB Garamond', serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body {
  height: 100%; margin: 0; background: var(--bg); color: var(--cream);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  background-image: radial-gradient(ellipse at top, #2a1f14 0%, #161009 60%);
}

h1, h2, h3, .title { font-family: var(--font-title); letter-spacing: .02em; color: var(--gold); margin: 0; }
#app { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; }

button {
  font-family: var(--font-body); font-size: 16px; cursor: pointer; border-radius: 5px;
  border: 1px solid var(--line); background: var(--panel2); color: var(--cream);
  padding: 10px 16px; transition: background .15s;
}
button:hover { background: #3a2c1c; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: not-allowed; }

input[type=text], input[type=number] {
  font-family: var(--font-body); font-size: 16px; background: #100c07; border: 1px solid var(--line);
  color: var(--cream); padding: 8px 10px; border-radius: 4px; width: 100%;
}

/* Utilitaires */
.hidden { display: none !important; }
.center { text-align: center; }
.hint { color: var(--dim); align-self: center; }
</style>
<style>
/* css/components.css */
/* Composants réutilisés sur plusieurs écrans. */

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
.card.section { margin-top: 14px; }
.card.notice { margin-bottom: 16px; border-color: var(--gold); }
.card.waiting { text-align: center; color: var(--dim); }

.btn-primary { font-family: var(--font-title); padding: 12px 28px; }

/* En-tête d'écran */
.hero { text-align: center; margin-bottom: 28px; }
.hero h1 { font-size: clamp(28px, 6vw, 42px); }
.hero p { color: var(--dim); margin-top: 4px; }

/* Barres de PV / ressource */
.barwrap { background: #100c07; border-radius: 3px; height: 8px; overflow: hidden; margin-top: 4px; }
.bar { height: 100%; }

/* Grille de cartes de personnage (création, statistiques) */
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
.slot { border-top: 3px solid var(--c, var(--line)); }
.slot .icon { font-size: 34px; }
.slot .cname { font-family: var(--font-title); font-size: 15px; margin: 6px 0 2px; }
.slot .role { color: var(--dim); font-size: 13px; margin-bottom: 8px; }
.slot .stats { font-size: 13px; color: var(--dim); margin: 8px 0; }
.class-picker { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 8px; }
.class-picker button { padding: 2px 6px; font-size: 18px; line-height: 1.3; opacity: .55; border-bottom: 3px solid var(--c); }
.class-picker button.selected { opacity: 1; outline: 2px solid var(--gold); background: #3a2c1c; }
.class-picker button:hover { opacity: 1; }
.slot .class-desc { font-size: 12px; color: var(--dim); margin: 6px 0 10px; line-height: 1.35; }

.skillbox { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }

/* Infobulles : <x class="tooltip" data-tip="..."> */
.tooltip { position: relative; cursor: help; border-bottom: 1px dotted var(--dim); }
button.tooltip { border-bottom: 1px solid var(--line); cursor: pointer; }
button.tooltip:disabled { cursor: not-allowed; }
.tooltip:hover::after, .tooltip:focus-visible::after {
  content: attr(data-tip); position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(100% + 9px);
  background: #0c0904; border: 1px solid var(--line); color: var(--cream); padding: 9px 11px; border-radius: 5px;
  font-size: 13px; line-height: 1.4; width: 210px; z-index: 30; box-shadow: 0 6px 14px rgba(0,0,0,.55); white-space: pre-line; text-align: left;
  pointer-events: none; /* l'infobulle ne doit jamais masquer les boutons qu'elle recouvre */
}
.tooltip:hover::before, .tooltip:focus-visible::before {
  content: ''; position: absolute; left: 50%; transform: translateX(-50%); bottom: 100%;
  border: 6px solid transparent; border-top-color: var(--line); z-index: 30; pointer-events: none;
}

button.full { width: 100%; margin-top: 12px; }

/* Objets */
.rarity-text { color: var(--rc); }
.item-chip { color: var(--rc); border-bottom-color: var(--rc); font-size: 14px; }
.item-card { border-left: 3px solid var(--rc); padding: 4px 0 4px 12px; margin-bottom: 12px; }
.item-card .item-name { font-family: var(--font-title); color: var(--rc); font-size: 16px; }
.item-card .item-rarity {
  display: inline-block; margin: 2px 0; padding: 0 8px; border: 1px solid var(--rc); border-radius: 10px;
  color: var(--rc); font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
}
.item-card .item-meta { color: var(--dim); font-size: 13px; }
.item-stats { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; }
.item-stats li.secondary { color: var(--r-peu-commun); }
.item-legendary { color: var(--r-legendaire); font-size: 14px; margin-top: 6px; font-style: italic; }
.item-absorbed { color: var(--r-divin); }

/* Tableau de stats */
.stat-row { display: flex; justify-content: space-between; gap: 8px; }
.stat-row small { color: var(--dim); }
.slot.selected { outline: 2px solid var(--gold); }
.class-details { border-top: 3px solid var(--c); margin: 14px 0 20px; }
.class-details .details-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.class-details h2 { font-size: 20px; margin: 0; }
.class-details h3 { font-size: 15px; margin: 12px 0 6px; }
.details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.details-items { display: flex; flex-wrap: wrap; gap: 10px; }
.details-classes button { font-size: 14px; opacity: .7; }
.details-classes button.selected { opacity: 1; }
.class-details > h2 { margin: 12px 0 4px; border-left: 4px solid var(--c); padding-left: 8px; }
.leg-class { display: inline-block; font-size: 15px; padding: 0 4px; border-radius: 4px; border-bottom: 2px solid var(--c, var(--gold)); }
.legendaries .item-card { flex: 1 1 260px; max-width: 320px; }
.item-stats .stat-range { color: var(--dim); font-size: 12px; }
</style>
<style>
/* css/screens.css */
/* Styles propres à chaque écran. */

/* ---- Statistiques ---- */
.slot .stats.sheet, .class-details .stats.sheet { text-align: left; line-height: 1.7; }
.boosted { color: var(--r-legendaire); font-size: 12px; }
.equipped-list { gap: 4px 12px; }
.skill-line { width: 100%; font-size: 13px; color: var(--dim); margin-bottom: 6px; text-align: left; }
.skill-line b { color: var(--cream); }

/* ---- Village ---- */
.notice .loot { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; }
.portals { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin: 16px 0; }
.portal { text-align: left; width: 100%; padding: 16px; background: var(--panel); }
.portal.locked { opacity: .55; }
.portal p b { color: var(--gold); }
.start-floors { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.start-floors button { padding: 6px 10px; font-size: 14px; }
.start-floors small { color: var(--dim); }
.subzones { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.subzone { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
.subzone small { color: var(--dim); }
.subzone.locked { opacity: .5; }
.subzone button { padding: 5px 12px; font-size: 14px; }
.portal h3 { font-size: 16px; }
.portal p { color: var(--dim); font-size: 13px; margin: 4px 0 0; }
.services { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.party-strip { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0 10px; }
.pmini { min-width: 120px; text-align: center; padding: 10px; border-top: 3px solid var(--c, var(--line)); }
.pmini .icon { font-size: 24px; }
.pmini.dead { opacity: .5; }

/* ---- Combat ---- */
.combatants { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 12px; }
@media (max-width: 600px) { .combatants { grid-template-columns: 1fr; } }
.side-title { font-size: 14px; color: var(--dim); margin-bottom: 6px; }
.unit {
  padding: 10px; border-radius: 5px; background: var(--panel2); border-left: 3px solid var(--c, var(--line));
  margin-bottom: 8px; transition: opacity .3s;
}
.unit.dead { opacity: .35; }
.unit .row1 { display: flex; justify-content: space-between; align-items: baseline; }
.unit .row1 b { font-family: var(--font-title); font-size: 14px; }
.unit small { color: var(--dim); }
.unit .status { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tag { font-size: 12px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line); background: #1a130c; }
.tag.buff { color: #9fd08f; border-color: #3f6b45; }
.tag.debuff { color: #e6a59a; border-color: #7a3a33; }
.active-turn { outline: 2px solid var(--gold); }
.hero-name { color: var(--c); }

.log {
  background: #100c07; border: 1px solid var(--line); border-radius: 4px; padding: 10px;
  font-size: 14px; height: 110px; overflow-y: auto; margin: 12px 0;
}
.log div { margin-bottom: 3px; color: var(--dim); }
.log div.hit { color: var(--cream); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.actions .end-turn { margin-left: auto; border-color: var(--gold); }
.unit .combo { display: block; margin-top: 2px; }
.unit .combo b { color: var(--gold); letter-spacing: 2px; }
.target-zone { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* ---- Équipement ---- */
.hero-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.hero-tabs button { border-top: 3px solid var(--c); }
.hero-tabs button.selected { background: #3a2c1c; outline: 1px solid var(--gold); }
.equip-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-bottom: 20px; }
@media (max-width: 700px) { .equip-layout { grid-template-columns: minmax(0, 1fr); } }
.slot-list { border-top: 3px solid var(--c); }
.slot-list h3 { font-size: 16px; margin-bottom: 8px; }
.slot-list h3 small { color: var(--dim); font-family: var(--font-body); }
.slot-row, .bag-row {
  display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left;
  padding: 6px 10px; margin-bottom: 4px; font-size: 14px; background: var(--panel2);
}
.slot-row.empty { color: var(--dim); border: 1px dashed var(--line); border-radius: 5px; }
.slot-name { color: var(--dim); }
.bag-row { flex-direction: column; gap: 0; }
.bag-row small { color: var(--dim); font-size: 12px; }
.bag-row.unusable { opacity: .5; }
.slot-row.selected, .bag-row.selected { outline: 2px solid var(--gold); }
.equip-stats { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 14px; line-height: 1.7; }
.card.detail, .card.bag { margin-bottom: 14px; }
.card.bag h3 { font-size: 16px; margin-bottom: 8px; }
.equip-option { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.equip-option small { color: var(--dim); margin-left: 8px; }
.diff { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 14px; }
.diff .up { color: var(--r-peu-commun); }
.diff .down { color: #e06a5a; }
.warning { color: #e06a5a; }

/* ---- Forge ---- */
.card.materia { margin-bottom: 14px; overflow-x: auto; }
.materia table, table.materia-table { border-collapse: collapse; width: 100%; font-size: 14px; }
.materia th, .materia td, .materia-table th, .materia-table td { padding: 4px 8px; text-align: center; white-space: nowrap; }
.materia thead th, .materia-table thead th { color: var(--rc); font-weight: 600; }
.materia tbody th, .materia-table tbody th { text-align: left; font-weight: 400; color: var(--dim); }
.materia td.zero, .materia-table td.zero { color: var(--dim); opacity: .5; }
.forge-list h3 { font-size: 16px; margin-bottom: 8px; }
.forge-list .bag-title { margin-top: 16px; }
.forge-hero { font-size: 13px; color: var(--dim); margin: 8px 0 4px; border-left: 3px solid var(--c); padding-left: 6px; }
.forge-section { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.forge-section h3 { font-size: 15px; margin-bottom: 6px; }
.forge-section p { margin: 4px 0 8px; }
.cost { list-style: none; padding: 0; margin: 0 0 8px; font-size: 14px; }
.cost li.ok::before { content: '✓ '; color: var(--r-peu-commun); }
.cost li.lack::before { content: '✗ '; color: #e06a5a; }
.cost li.lack { color: #e6b3aa; }
.cost small { color: var(--dim); }
.forge-section .diff { margin-bottom: 10px; }
button.danger { border-color: #e06a5a; color: #f2c4bb; background: #3a1c17; }

/* ---- Talents ---- */
.badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 9px; background: var(--gold); color: #1a130c; font-size: 12px; font-weight: 700; text-align: center; }
.pmini .xp-label { display: block; margin-top: 4px; font-size: 11px; color: var(--dim); }
.xp small { color: var(--dim); font-size: 12px; }
.talent-summary { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-top: 3px solid var(--c); margin-bottom: 10px; }
.talent-summary .xp { min-width: 180px; }
.talent-summary .points.has b { color: var(--gold); font-size: 20px; }
.talent-branches { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 20px; }
.branch h3 { font-size: 17px; }
.branch h3 small { color: var(--dim); font-family: var(--font-body); font-size: 13px; }
.branch > .hint { font-size: 13px; margin: 4px 0 10px; }
.talent { border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; margin-bottom: 8px; background: var(--panel2); font-size: 14px; }
.talent.skill, .talent.passive { border-left: 3px solid var(--gold); }
.talent.signature { border: 1px solid var(--gold); border-left-width: 4px; background: #2e2414; }
.tier-group { margin-bottom: 6px; }
.tier-title { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 4px; }
.tier-group.locked .tier-title { color: var(--dim); }
.talent.locked { opacity: .5; }
.talent.learned { border-color: #3f6b45; }
.talent.maxed { border-color: #6cc15a; background: #1f2a1a; }
.talent-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
.talent-head b { font-family: var(--font-title); font-size: 14px; color: var(--cream); }
.talent-head .tier, .talent-head .kind { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
.talent-head .rank { margin-left: auto; font-weight: 700; color: var(--gold); }
.talent-body { margin: 4px 0 6px; color: var(--cream); }
.talent-body small { color: var(--dim); }
.talent button { padding: 4px 12px; font-size: 14px; }
.talent .reason { color: var(--dim); font-style: italic; }

/* ---- Marchand ---- */
.gold { color: var(--gold); }
.shop-section { margin-bottom: 14px; }
.shop-section h3 { font-size: 16px; margin-bottom: 4px; }
.shop-section h3 small { color: var(--dim); font-family: var(--font-body); font-size: 13px; }
.shop-section > .hint { font-size: 13px; margin: 0 0 10px; }
.shop-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); }
.shop-info { min-width: 0; }
.shop-info small { color: var(--dim); }
.shop-info .hint { font-size: 12px; }
.shop-row button { flex-shrink: 0; padding: 6px 12px; font-size: 14px; }

/* ---- Donjon / expédition ---- */
.unit.boss { border-left-width: 5px; background: #2a1712; }
.boss-tag { font-size: 10px; padding: 0 5px; border-radius: 6px; background: var(--danger); color: #fff; vertical-align: middle; letter-spacing: .05em; }
.floor-track { margin-bottom: 12px; }
.floor-track small { color: var(--dim); }
.floors { display: flex; gap: 6px; margin-top: 6px; }
.floor { flex: 1; text-align: center; padding: 6px 0; border: 1px solid var(--line); border-radius: 4px; color: var(--dim); background: #100c07; }
.floor.done { background: #22301c; color: #9fd08f; border-color: #3f6b45; }
.floor.next { outline: 2px solid var(--gold); color: var(--cream); }
.floor.boss { border-color: var(--danger); }
.expedition-info { margin-bottom: 8px; }
.expedition-info b { color: var(--gold); }
.expedition .actions { margin-bottom: 10px; }
.boss-btn { border-color: var(--danger); background: #3a1c17; }

/* ---- Objets (donjon, Marchand) ---- */
.map-items { margin: 8px 0 12px; padding-top: 8px; border-top: 1px dashed var(--line); }
.map-items button.selected { outline: 2px solid var(--gold); }
.shop-cat { font-family: var(--font-title); color: var(--gold); font-size: 13px; margin: 12px 0 2px; letter-spacing: .05em; text-transform: uppercase; }
.boss-choice { margin: 8px 0 12px; padding: 12px; border: 1px solid var(--gold); border-radius: 6px; background: #2a1f14; }
.boss-choice p { margin: 0 0 10px; }

/* ---- Positions ---- */
.row-tag { font-size: 13px; margin-left: 2px; }
.rules { margin: 0; padding-left: 20px; line-height: 1.6; }
.pos-choice { display: flex; gap: 8px; margin: 10px 0; }
.pos-choice button { flex: 1; }
.pos-choice button.selected { background: #3a2c1c; outline: 2px solid var(--gold); }
.slot .warn { color: #e6a59a; font-size: 13px; margin: 6px 0 0; }

/* ---- Auberge et banque ---- */
.roster { display: flex; flex-wrap: wrap; gap: 10px; }
.hero-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 170px; border-left: 4px solid var(--c); text-align: left; }
.hero-tile .icon { font-size: 22px; }
.hero-tile:disabled { opacity: 1; cursor: default; }
.hero-tile.clickable:not(:disabled):hover, .hero-tile.selected { outline: 2px solid var(--gold); background: #3a2c1c; }
.card:has(> .materia-table) { overflow-x: auto; }
.bank-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.bank-table td, .bank-table th { padding: 4px 8px; text-align: center; }
.bank-table th:first-child { text-align: left; }
.materia-table button.mini { padding: 0 6px; font-size: 12px; }
#goldAmount { width: 110px; }

/* ---- Événements d'expédition ---- */
.card.event { border: 1px solid var(--gold); background: #2a2015; margin: 10px 0; }
.card.event h3 { margin-top: 0; }
.event-choices { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 12px; }
.event-choice { flex: 1 1 260px; }
.event-choice ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; color: var(--dim); }
.event-stock .bag-row { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 10px; text-align: left; }
.event-stock .bag-row button { margin-left: auto; }

/* ---- Journal et résumé de victoire ---- */
.log div.crit { color: #ffcf6b; font-weight: 600; }
.log .has-detail { cursor: help; }
.log .has-detail .why { color: var(--dim); font-size: 11px; }
.log .tooltip::after { width: 340px; }
.last-log summary { cursor: pointer; color: var(--gold); }
.last-log .log { height: 200px; }
.victory-summary h3 { margin: 0 0 6px; }
.victory-summary table { border-collapse: collapse; }
.victory-summary th { text-align: left; padding: 3px 12px 3px 0; font-weight: 400; color: var(--dim); white-space: nowrap; vertical-align: top; }
.victory-summary td { padding: 3px 0; }

/* ---- Difficulté ---- */
.difficulty-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 14px; margin-bottom: 12px; }
.card.difficulty.selected { outline: 2px solid var(--gold); background: #2a2015; }
.card.difficulty h2 { margin-top: 0; }
.card.difficulty p { margin: 4px 0; font-size: 14px; }
.rarity-table { border-collapse: collapse; font-size: 12px; width: 100%; margin: 8px 0; }

  if (e.item) parts.push(`un équipement ${RARITIES[e.item.minRarity].label.toLowerCase()} ou mieux`);
